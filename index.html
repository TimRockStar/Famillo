<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famillo</title>
<meta name="theme-color" content="#ff6b6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --c1:#ff6b6b; --c2:#ffa94d; --mauve:#9775fa;
    --fond:#fff8f0; --carte:#fff; --carte2:#fff4e6; --texte:#2b2140; --doux:#7a7090; --champ:#fffcf8; --bord:#f0e6dc;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-mode=clair]) { --fond:#17131f; --carte:#241e30; --carte2:#2d2540; --texte:#f3eefc; --doux:#a89fbd; --champ:#1d1827; --bord:#3a3150; color-scheme:dark; }
  }
  :root[data-mode=sombre] { --fond:#17131f; --carte:#241e30; --carte2:#2d2540; --texte:#f3eefc; --doux:#a89fbd; --champ:#1d1827; --bord:#3a3150; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:600 17px/1.4 Nunito, system-ui, sans-serif; background:var(--fond); color:var(--texte); padding-bottom:96px; }
  header { background:linear-gradient(135deg, var(--c1), var(--c2)); color:#fff; padding:22px 18px 56px; border-radius:0 0 32px 32px; position:relative; overflow:hidden; text-shadow:0 1px 4px rgba(0,0,0,.2); }
  header:not(.photo)::after { content:''; position:absolute; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.15); right:-50px; top:-60px; }
  header.photo { padding-top:30px; padding-bottom:90px; }
  header .haut { display:flex; justify-content:space-between; align-items:center; gap:8px; position:relative; z-index:1; }
  header .app img { width:30px; height:30px; border-radius:50%; background:#fff; vertical-align:middle; margin-right:6px; padding:2px; }
  header .app { font-weight:900; font-size:15px; opacity:.9; letter-spacing:.5px; flex:1; }
  .rond { border:2px solid rgba(255,255,255,.7); background:rgba(0,0,0,.08); color:#fff; border-radius:20px; padding:4px 12px; font:800 14px Nunito, sans-serif; cursor:pointer; }
  header h1 { margin:14px 0 0; font-size:26px; font-weight:900; position:relative; z-index:1; }
  header p { margin:4px 0 0; opacity:.95; position:relative; z-index:1; }
  main { padding:0 16px; max-width:640px; margin:-36px auto 0; position:relative; }
  nav { position:fixed; bottom:12px; left:12px; right:12px; display:flex; background:var(--carte); border-radius:24px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.18); max-width:616px; margin:auto; }
  nav button { flex:1; border:0; background:none; padding:6px 2px; font:700 11px Nunito, sans-serif; color:var(--doux); border-radius:18px; transition:.2s; }
  nav button span { display:block; font-size:24px; transition:transform .2s; }
  nav button.actif { background:color-mix(in srgb, var(--c1) 15%, transparent); color:var(--c1); }
  nav button.actif span { transform:scale(1.2) translateY(-2px); }
  .carte { background:var(--carte); border-radius:20px; padding:14px 16px; margin-bottom:12px; box-shadow:0 4px 14px rgba(0,0,0,.07); display:flex; gap:12px; align-items:flex-start; animation:entre .35s ease both; }
  .carte .corps { flex:1; min-width:0; }
  .carte b { display:block; font-size:18px; font-weight:800; }
  .bulle { flex:none; width:46px; height:46px; border-radius:16px; display:grid; place-items:center; font-size:24px; }
  .avatar { flex:none; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:900; color:#fff; font-size:20px; object-fit:cover; }
  .meds .bulle { background:rgba(255,107,107,.16); } .rdv .bulle { background:rgba(77,171,247,.16); } .taches .bulle { background:rgba(56,217,169,.16); }
  .petit { color:var(--doux); font-size:15px; display:block; }
  .pastille { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:20px; font-size:14px; font-weight:800; }
  .pastille.ok { background:rgba(56,217,169,.16); color:#12a37a; }
  .pastille.alerte { background:rgba(255,146,43,.16); color:#e8590c; }
  .boutons { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .btn { border:0; border-radius:14px; padding:10px 16px; font:800 15px Nunito, sans-serif; background:rgba(151,117,250,.14); color:var(--mauve); text-decoration:none; display:inline-block; cursor:pointer; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .btn.plein { background:linear-gradient(135deg, var(--c1), var(--c2)); color:#fff; box-shadow:0 4px 12px color-mix(in srgb, var(--c1) 35%, transparent); }
  .btn.danger { background:rgba(250,82,82,.12); color:#f03e3e; }
  .fiche { align-items:center; background:linear-gradient(135deg, var(--carte), var(--carte2)); }
  .fiche h2 { margin:0 0 4px; font-size:22px; font-weight:900; }
  .grande { flex:none; width:84px; height:84px; border-radius:50%; object-fit:cover; border:4px solid var(--carte); box-shadow:0 4px 12px rgba(0,0,0,.15); align-self:flex-start; }
  h2.section { font-size:21px; font-weight:900; margin:22px 4px 12px; }
  label { display:block; margin:12px 0 4px; font-weight:800; }
  input, textarea, select { width:100%; font:600 16px Nunito, sans-serif; padding:12px; border:2px solid var(--bord); border-radius:14px; background:var(--champ); color:var(--texte); }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--c2); }
  .apercu { width:64px; height:64px; border-radius:16px; object-fit:cover; }
  .apercu[src=""] { display:none; }
  .themes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .themes label { margin:0; text-align:center; font-size:13px; cursor:pointer; }
  .themes input { display:none; }
  .themes span { display:block; height:44px; border-radius:14px; border:3px solid transparent; margin-bottom:2px; }
  .themes input:checked + span { border-color:var(--texte); }
  dialog { border:0; border-radius:26px; width:min(92vw,480px); padding:20px; max-height:90vh; background:var(--carte); color:var(--texte); }
  dialog[open] { animation:monte .25s ease; }
  dialog::backdrop { background:rgba(20,15,30,.5); }
  dialog h2 { margin:0 0 6px; font-size:22px; font-weight:900; }
  .vide { text-align:center; padding:28px 16px; color:var(--doux); background:var(--carte); border-radius:20px; }
  .vide span { font-size:44px; display:block; margin-bottom:6px; }
  footer { text-align:center; margin:28px 0 8px; color:var(--doux); font-size:14px; }
  footer .boutons { justify-content:center; }
  footer a { color:var(--doux); font-weight:800; }
  .ajouter { position:fixed; right:22px; bottom:100px; width:60px; height:60px; border-radius:50%; border:0; font-size:32px; color:#fff;
    background:linear-gradient(135deg, var(--c2), var(--c1)); box-shadow:0 8px 20px color-mix(in srgb, var(--c1) 45%, transparent); cursor:pointer; }
  @keyframes entre { from { opacity:0; transform:translateY(10px); } }
  @keyframes monte { from { opacity:0; transform:translateY(30px) scale(.97); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header id="entete">
  <div class="haut"><span class="app"><img src="favicon.png" alt=""><span id="nomApp"></span></span>
    <button class="rond" id="perso" onclick="personnaliser()"></button><button class="rond" id="langue" onclick="changerLangue()"></button></div>
  <h1 id="titre"></h1><p id="sousTitre"></p>
</header>
<main id="page"></main>

<script>
const NOM_APP = 'Famillo';
// shortcut: données et photos dans localStorage (environ 5 Mo, sur le téléphone seulement), passer à IndexedDB si les gens manquent de place.
const CLE = 'famillo';
let d = JSON.parse(localStorage.getItem(CLE) || 'null') || { aide:{}, meds:[], rdv:[], taches:[], famille:[] };
d.reglages ||= { theme:'corail', mode:'auto', fond:'' };
let lang = localStorage.getItem(CLE + '-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en');

const THEMES = { corail:['#ff6b6b','#ffa94d'], ocean:['#1c7ed6','#22b8cf'], foret:['#2b8a3e','#82c91e'], lavande:['#7950f2','#f783ac'], soleil:['#f76707','#fab005'], baie:['#c2255c','#7048e8'] };

const TXT = {
  fr: {
    autre:'EN', accueil:'Accueil', meds:'Médicaments', rdv:'Rendez-vous', taches:'Tâches', famille:'Famille',
    bonjour:'Bonjour ! 👋', semaineDe: n => `Voici la semaine de ${n}`, laPersonne:'la personne aidée', personneAidee:'Personne aidée',
    medecin:'Médecin', ramq:'Assurance maladie', modifierFiche:'Modifier la fiche', cetteSemaine:'Cette semaine',

    nomMed:'Nom du médicament', dose:'Dose (facultatif, ex. : 20 mg)', heure:'Quand le prendre (facultatif)', renouv:'Date de renouvellement (seulement si on ne compte pas les pilules)', renouveler:'Renouveler le',
    qte:'Pilules dans la bouteille neuve (écrit sur l\'étiquette, ex. : 30). Bouteille déjà commencée ? Mets ce que tu comptes aujourd\'hui.', debut:'Date de la première prise (ou aujourd\'hui, si tu viens de compter)', parJour:'Pilules par jour (1, 2, 3…)',
    recompter:'🔢 Recompter', rappelCal:'📅 Rappel', resteQuestion:'Combien de pilules reste-t-il dans le pot ?',
    resteHint:'Le calcul suppose que la dose d\'aujourd\'hui n\'est pas encore prise.',
    avisMed:'Cette app ne remplace pas l\'avis du pharmacien ou du médecin.',
    pharmacien:'Si ça arrive souvent, parles-en au pharmacien : un pilulier peut aider.',
    vide:'🚨 Le pot est vide ou presque',
    attendu: n => `Il devrait en rester environ ${n}`,
    ordre: dt => `✅ Dernier décompte (${dt}) : tout est en ordre`,
    oubliees: (dt, n) => `⚠️ Dernier décompte (${dt}) : ${n} dose${n > 1 ? 's' : ''} possiblement oubliée${n > 1 ? 's' : ''}`,
    enMoins: (dt, n) => `⚠️ Dernier décompte (${dt}) : ${n} pilule${n > 1 ? 's' : ''} de moins que prévu. À vérifier avec le pharmacien.`,
    totalOublis: n => `Total d'oublis possibles depuis le début : ${n}`,
    finPrevue: (dt, j) => `🔄 Fin prévue le ${dt} (dans ${j} jour${j > 1 ? 's' : ''})`,
    rappelTitre: (m, a) => `Renouveler ${m} pour ${a}`,
    msgMed: (p, a, m, j) => `Bonjour ${p}, ` + (j == null ? `${a} aura bientôt besoin de renouveler : ${m}.` : j <= 0 ? `il ne reste presque plus de ${m} pour ${a}.` : `il reste environ ${j} jour${j > 1 ? 's' : ''} de ${m} pour ${a}.`) + ' Peux-tu passer à la pharmacie ? Réponds-moi par texto. Merci !',
    quoiRdv:'Rendez-vous (ex. : cardiologue)', quand:'Date et heure', lieu:'Lieu', qui:'Qui s\'en occupe', personne:'Personne encore',
    sOccupe: n => `${n} s'en occupe`, quoiTache:'Tâche (ex. : épicerie)', nom:'Nom', tel:'Numéro de téléphone', photo:'Photo',
    demander:'📱 Demander de l\'aide', modifier:'Modifier', contacts:'👥 Choisir dans mes contacts', ajouter:'Ajouter',
    enregistrer:'Enregistrer', annuler:'Annuler', supprimer:'Supprimer', confirmer:'Supprimer pour de bon ?', fermer:'Fermer',
    aQui:'À qui demander ?', texter:'📱 Texter', apres:'Quand la personne te répond oui, choisis son nom dans « Qui s\'en occupe ».',
    familleVide:'Ajoute d\'abord une personne dans l\'onglet Famille.', medecinTel:'Médecin et téléphone', numRamq:'Numéro d\'assurance maladie', notes:'Notes (allergies, etc.)',
    personnaliser:'🎨 Personnaliser', couleurs:'Couleurs', apparence:'Apparence', auto:'Auto (comme le téléphone)', clair:'☀️ Clair', sombre:'🌙 Sombre',
    fondEcran:'Photo d\'arrière-plan (en haut)', choisirPhoto:'📷 Choisir une photo', retirer:'Retirer',
    plein:'Le téléphone manque de place pour les photos. Retire une photo ou choisis-en une plus petite.',
    th_corail:'Corail', th_ocean:'Océan', th_foret:'Forêt', th_lavande:'Lavande', th_soleil:'Soleil', th_baie:'Petits fruits',
    suggerer:'💡 Suggérer une idée', demandes:'✅ Vous l\'avez demandé', propulse:'Propulsé par',
    sujetIdee:'Famillo : une idée', corpsIdee:'Bonjour ! Ce serait le fun si Famillo pouvait : ',
    demandesIntro:'Les idées des utilisateurs qu\'on a ajoutées. On lit toutes les suggestions !',
    demandesVide:'Aucune encore. Ta suggestion pourrait être la première sur cette liste !',
    msgRdv: (p, a, r, quand) => `Bonjour ${p}, ${a} a un rendez-vous : ${r.quoi}, ${quand}${r.lieu ? ' (' + r.lieu + ')' : ''}. Peux-tu t'en occuper ? Réponds-moi par texto. Merci !`,
    msgTache: (p, a, t) => `Bonjour ${p}, peux-tu t'occuper de : ${t.quoi}, pour ${a} ? Réponds-moi par texto. Merci !`,
  },
  en: {
    autre:'FR', accueil:'Home', meds:'Meds', rdv:'Appointments', taches:'Tasks', famille:'Family',
    bonjour:'Hi there! 👋', semaineDe: n => `Here's ${n}'s week`, laPersonne:'your loved one', personneAidee:'Loved one',
    medecin:'Doctor', ramq:'Health card', modifierFiche:'Edit profile', cetteSemaine:'This week',
    rienSemaine:'A quiet week! Nothing planned.', rien:'Nothing yet. Tap + to get started!',
    nomMed:'Medication name', dose:'Dose (optional, e.g. 20 mg)', heure:'When to take it (optional)', renouv:'Refill date (only if not counting pills)', renouveler:'Refill on',
    qte:'Pills in the new bottle (on the pharmacy label, e.g. 30). Bottle already started? Enter what you count today.', debut:'Date of the first dose (or today, if you just counted)', parJour:'Pills per day (1, 2, 3…)',
    recompter:'🔢 Recount', rappelCal:'📅 Reminder', resteQuestion:'How many pills are left in the bottle?',
    resteHint:'The calculation assumes today\'s dose has not been taken yet.',
    avisMed:'This app does not replace the advice of a pharmacist or doctor.',
    pharmacien:'If this happens often, talk to the pharmacist: a pill organizer can help.',
    vide:'🚨 The bottle is empty or almost',
    attendu: n => `About ${n} should be left`,
    ordre: dt => `✅ Last count (${dt}): all good`,
    oubliees: (dt, n) => `⚠️ Last count (${dt}): ${n} dose${n > 1 ? 's' : ''} possibly missed`,
    enMoins: (dt, n) => `⚠️ Last count (${dt}): ${n} pill${n > 1 ? 's' : ''} fewer than expected. Check with the pharmacist.`,
    totalOublis: n => `Total possible missed doses so far: ${n}`,
    finPrevue: (dt, j) => `🔄 Runs out on ${dt} (in ${j} day${j > 1 ? 's' : ''})`,
    rappelTitre: (m, a) => `Refill ${m} for ${a}`,
    msgMed: (p, a, m, j) => `Hi ${p}, ` + (j == null ? `${a} will soon need a refill of: ${m}.` : j <= 0 ? `${a} is almost out of ${m}.` : `${a} has about ${j} day${j > 1 ? 's' : ''} of ${m} left.`) + ' Can you stop by the pharmacy? Text me back. Thanks!',
    quoiRdv:'Appointment (e.g. cardiologist)', quand:'Date and time', lieu:'Place', qui:'Who\'s taking care of it', personne:'Nobody yet',
    sOccupe: n => `${n} is on it`, quoiTache:'Task (e.g. groceries)', nom:'Name', tel:'Phone number', photo:'Photo',
    demander:'📱 Ask for help', modifier:'Edit', contacts:'👥 Pick from my contacts', ajouter:'Add',
    enregistrer:'Save', annuler:'Cancel', supprimer:'Delete', confirmer:'Delete for good?', fermer:'Close',
    aQui:'Who should I ask?', texter:'📱 Text', apres:'When they reply yes, pick their name under "Who\'s taking care of it".',
    familleVide:'First add someone in the Family tab.', medecinTel:'Doctor and phone', numRamq:'Health card number', notes:'Notes (allergies, etc.)',
    personnaliser:'🎨 Customize', couleurs:'Colours', apparence:'Appearance', auto:'Auto (like the phone)', clair:'☀️ Light', sombre:'🌙 Dark',
    fondEcran:'Background photo (top)', choisirPhoto:'📷 Choose a photo', retirer:'Remove',
    plein:'The phone is out of room for photos. Remove a photo or pick a smaller one.',
    th_corail:'Coral', th_ocean:'Ocean', th_foret:'Forest', th_lavande:'Lavender', th_soleil:'Sunshine', th_baie:'Berries',
    suggerer:'💡 Suggest an idea', demandes:'✅ You asked, we did it', propulse:'Powered by',
    sujetIdee:'Famillo: an idea', corpsIdee:'Hi! It would be great if Famillo could: ',
    demandesIntro:'Ideas from users that we added. We read every suggestion!',
    demandesVide:'None yet. Your suggestion could be the first on this list!',
    msgRdv: (p, a, r, quand) => `Hi ${p}, ${a} has an appointment: ${r.quoi}, ${quand}${r.lieu ? ' (' + r.lieu + ')' : ''}. Can you take care of it? Text me back. Thanks!`,
    msgTache: (p, a, t) => `Hi ${p}, can you take care of: ${t.quoi}, for ${a}? Text me back. Thanks!`,
  },
};
const t = k => TXT[lang][k];
const locale = () => lang === 'fr' ? 'fr-CA' : 'en-CA';

const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(d)); return true; } catch { alert(t('plein')); return false; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const nomAide = () => d.aide.nom || t('laPersonne');
const nomDe = id => (d.famille.find(p => p.id === id) || {}).nom;
const dateFr = s => s ? new Date(s).toLocaleString(locale(), { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }) : '';
const jourFr = s => s ? new Date(s + 'T12:00').toLocaleDateString(locale(), { day:'numeric', month:'long' }) : '';
const dansJours = (s, n) => s && (new Date(s) - Date.now()) < n * 864e5;
const COULEURS = ['#ff6b6b','#ffa94d','#38d9a9','#4dabf7','#9775fa','#f783ac'];
const avatar = p => p.photo ? `<img class="avatar" src="${esc(p.photo)}" alt="">`
  : `<div class="avatar" style="background:${COULEURS[parseInt(p.id, 36) % COULEURS.length]}">${esc((p.nom || '?')[0].toUpperCase())}</div>`;

// Réduit une photo pour ne pas remplir le téléphone (côté le plus long = max pixels).
async function reduire(blob, max) {
  const img = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .8);
}

// Suivi des pilules : on compare ce qu'il devrait rester avec ce que l'aidant compte dans le pot.
const iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
const aujourdhui = () => iso(new Date());
const ecartJours = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const ajouteJours = (s, n) => { const x = new Date(s + 'T12:00'); x.setDate(x.getDate() + n); return iso(x); };

function suivi(m) {
  const qte = Number(m.qte), par = Number(m.parJour) || 1;
  if (!qte || !m.debut) return null;
  const base = m.compte ? m.compte.reste : qte, depuis = m.compte ? m.compte.date : m.debut;
  const attendu = Math.max(0, Math.min(base, base - par * ecartJours(depuis, aujourdhui())));
  const jours = Math.floor(attendu / par);
  return { attendu, jours, fin: ajouteJours(aujourdhui(), jours) };
}

function recompter(id) {
  const m = d.meds.find(x => x.id === id), s = suivi(m);
  ouvrir(`<h2>🔢 ${esc(m.nom)}</h2><p class="petit">${t('attendu')(s.attendu)}. ${t('resteHint')}</p>` + champ(['reste', 'resteQuestion', 'number'], '') +
    `<p class="petit">${t('avisMed')}</p>`, v => {
      const reel = Number(v.reste), ecart = reel - s.attendu;
      if (ecart > 0) m.oublis = (Number(m.oublis) || 0) + ecart;
      m.compte = { reste: reel, date: aujourdhui(), ecart };
    });
  Object.assign($('dlg').querySelector('input'), { required: true, min: 0 });
}

// Le calendrier du téléphone sonne même quand l'app est fermée : on lui donne un rappel 7 jours avant la fin du pot.
function rappelCalendrier(id) {
  const m = d.meds.find(x => x.id === id), s = suivi(m);
  const jour = [ajouteJours(s.fin, -7), aujourdhui()].sort().pop(), j = x => x.replaceAll('-', ''), ics = x => String(x).replace(/[\\;,]/g, '\\$&').replace(/\n/g, '\\n');
  const texte = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Famillo//FR', 'BEGIN:VEVENT', `UID:${m.id}-${jour}@famillo.ca`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g, '')}`, `DTSTART;VALUE=DATE:${j(jour)}`, `DTEND;VALUE=DATE:${j(ajouteJours(jour, 1))}`,
    `SUMMARY:${ics(t('rappelTitre')(m.nom, nomAide()))}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${ics(m.nom)}`, 'TRIGGER:PT9H', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([texte], { type: 'text/calendar' })), download: `rappel-${m.nom.replace(/[^\w-]+/g, '-')}.ics` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Chaque liste est décrite une fois ; le même code affiche, ajoute et modifie.
const LISTES = {
  meds:    { ico:'💊', champs:[['nom','nomMed'],['parJour','parJour','number'],['debut','debut','date'],['qte','qte','number'],['dose','dose'],['heure','heure'],['renouv','renouv','date']],
             // Un nouveau pot (autre quantité ou autre début) efface l'ancien décompte.
             avant: (x, v) => { if (x.qte !== v.qte || x.debut !== v.debut) delete x.compte; },
             ligne: m => {
               const s = suivi(m), c = m.compte, n = Number(m.oublis) || 0;
               const fin = s ? (s.jours <= 0 ? `<span class="pastille alerte">${t('vide')}</span>` : `<span class="pastille ${s.jours <= 7 ? 'alerte' : 'ok'}">${t('finPrevue')(jourFr(s.fin), s.jours)}</span>`)
                 : m.renouv ? `<span class="pastille ${dansJours(m.renouv, 7) ? 'alerte' : 'ok'}">🔄 ${t('renouveler')} ${jourFr(m.renouv)}</span>` : '';
               return `<b>${esc(m.nom)}</b><span class="petit">${esc([m.dose, m.heure].filter(Boolean).join(' · '))}</span>` +
                 (s ? `<span class="petit">🔢 ${t('attendu')(s.attendu)}</span>` : '') +
                 (c ? `<span class="pastille ${c.ecart === 0 ? 'ok' : 'alerte'}">${c.ecart > 0 ? t('oubliees')(jourFr(c.date), c.ecart) : c.ecart < 0 ? t('enMoins')(jourFr(c.date), -c.ecart) : t('ordre')(jourFr(c.date))}</span>` : '') +
                 (c && c.ecart > 0 ? `<span class="petit">${t('pharmacien')}</span>` : '') + (n ? `<span class="petit">${t('totalOublis')(n)}</span>` : '') + fin;
             },
             extra: m => suivi(m) ? `<button class="btn" onclick="recompter('${m.id}')">${t('recompter')}</button><button class="btn" onclick="rappelCalendrier('${m.id}')">${t('rappelCal')}</button>` : '',
             message: (m, p) => t('msgMed')(p.nom, nomAide(), m.nom, suivi(m)?.jours) },
  rdv:     { ico:'📅', champs:[['quoi','quoiRdv'],['quand','quand','datetime-local'],['lieu','lieu'],['qui','qui','qui']],
             ligne: r => `<b>${esc(r.quoi)}</b><span class="petit">${dateFr(r.quand)}${r.lieu ? '<br>📍 ' + esc(r.lieu) : ''}</span>` + qui(r),
             message: (r, p) => t('msgRdv')(p.nom, nomAide(), r, dateFr(r.quand)) },
  taches:  { ico:'✅', champs:[['quoi','quoiTache'],['qui','qui','qui']],
             ligne: x => `<b>${esc(x.quoi)}</b>` + qui(x),
             message: (x, p) => t('msgTache')(p.nom, nomAide(), x) },
  famille: { ico:'👪', champs:[['nom','nom'],['tel','tel','tel'],['photo','photo','photo']],
             ligne: p => `<b>${esc(p.nom)}</b><span class="petit">${esc(p.tel)}</span>` },
};
const qui = x => x.qui ? `<span class="pastille ok">🙌 ${esc(t('sOccupe')(nomDe(x.qui) || ''))}</span>` : `<span class="pastille alerte">🙋 ${t('personne')}</span>`;

const ONGLETS = [['accueil','🏡'],['meds','💊'],['rdv','📅'],['taches','✅'],['famille','👪']];
let onglet = 'accueil';

function carte(nom, x, boutons = '') {
  const icone = nom === 'famille' ? avatar(x) : `<div class="bulle">${LISTES[nom].ico}</div>`;
  return `<div class="carte ${nom}">${icone}<div class="corps">${LISTES[nom].ligne(x)}${boutons}</div></div>`;
}

function appliquerReglages() {
  const r = d.reglages, [c1, c2] = THEMES[r.theme] || THEMES.corail, root = document.documentElement;
  root.style.setProperty('--c1', c1); root.style.setProperty('--c2', c2);
  if (r.mode === 'auto') delete root.dataset.mode; else root.dataset.mode = r.mode;
  document.querySelector('meta[name=theme-color]').content = c1;
  $('entete').classList.toggle('photo', !!r.fond);
  $('entete').style.background = r.fond ? `linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.5)), url("${r.fond}") center/cover` : '';
}

function afficher() {
  appliquerReglages();
  document.documentElement.lang = locale();
  $('nomApp').textContent = NOM_APP;
  $('langue').textContent = t('autre');
  $('perso').textContent = t('personnaliser');
  $('titre').textContent = onglet === 'accueil' ? t('bonjour') : LISTES[onglet].ico + ' ' + t(onglet);
  $('sousTitre').textContent = onglet === 'accueil' ? t('semaineDe')(nomAide()) : '';
  $('menu').innerHTML = ONGLETS.map(([id, ico]) => `<button class="${id === onglet ? 'actif' : ''}" onclick="onglet='${id}';afficher()"><span>${ico}</span>${t(id)}</button>`).join('');
  $('page').innerHTML = (onglet === 'accueil' ? accueil() : liste(onglet)) + `<footer><div class="boutons">
      <a class="btn" href="mailto:bonjour@lancetonapp.com?subject=${encodeURIComponent(t('sujetIdee'))}&body=${encodeURIComponent(t('corpsIdee'))}">${t('suggerer')}</a>
      <button class="btn" onclick="voirDemandes()">${t('demandes')}</button></div>
    <p>${t('propulse')} <a href="https://lancetonapp.com" target="_blank" rel="noopener">Lance ton app</a></p></footer>`;
}

// Idées des utilisateurs ajoutées à l'app : [fr, en] ; à remplir à chaque mise à jour.
const DEMANDES = [];

function voirDemandes() {
  $('dlg').innerHTML = `<h2>${t('demandes')}</h2><p class="petit">${t('demandesIntro')}</p>` +
    (DEMANDES.length ? DEMANDES.map(x => `<div class="carte"><span>✅</span><div class="corps">${esc(x[lang === 'fr' ? 0 : 1])}</div></div>`).join('') : `<div class="vide"><span>💡</span>${t('demandesVide')}</div>`) +
    `<div class="boutons"><button class="btn" onclick="$('dlg').close()">${t('fermer')}</button></div>`;
  $('dlg').showModal();
}

function changerLangue() {
  lang = lang === 'fr' ? 'en' : 'fr';
  localStorage.setItem(CLE + '-lang', lang);
  afficher();
}

function accueil() {
  const a = d.aide;
  const rdv = d.rdv.filter(r => r.quand && new Date(r.quand) > Date.now() - 36e5 && dansJours(r.quand, 7)).sort((x, y) => x.quand.localeCompare(y.quand));
  const meds = d.meds.filter(m => dansJours(suivi(m)?.fin || m.renouv, 7));
  const libres = d.taches.filter(x => !x.qui);
  const avenir = [...rdv.map(r => carte('rdv', r)), ...meds.map(m => carte('meds', m)), ...libres.map(x => carte('taches', x))].join('');
  return `<div class="carte fiche">${a.photo ? `<img class="grande" src="${esc(a.photo)}" alt="">` : ''}<div class="corps">
      <h2>${a.photo ? '' : '💛 '}${esc(a.nom || t('personneAidee'))}</h2>
      ${a.medecin ? `<div><span class="petit" style="display:inline">🩺 ${t('medecin')} :</span> ${esc(a.medecin)}</div>` : ''}
      ${a.ramq ? `<div><span class="petit" style="display:inline">🪪 ${t('ramq')} :</span> ${esc(a.ramq)}</div>` : ''}
      ${a.notes ? `<div class="petit" style="white-space:pre-wrap">📝 ${esc(a.notes)}</div>` : ''}
      <div class="boutons"><button class="btn" onclick="ficheAide()">✏️ ${t('modifierFiche')}</button></div></div></div>
    <h2 class="section">${t('cetteSemaine')}</h2>${avenir || `<div class="vide"><span>🌤️</span>${t('rienSemaine')}</div>`}`;
}

function liste(nom) {
  const L = LISTES[nom];
  const items = d[nom].map(x => carte(nom, x, `<div class="boutons">
      ${L.message ? `<button class="btn plein" onclick="demander('${nom}','${x.id}')">${t('demander')}</button>` : ''}
      ${L.extra ? L.extra(x) : ''}
      <button class="btn" onclick="formulaire('${nom}','${x.id}')">${t('modifier')}</button></div>`)).join('');
  const contacts = nom === 'famille' && 'contacts' in navigator ? `<div class="boutons" style="margin-bottom:12px"><button class="btn plein" onclick="depuisContacts()">${t('contacts')}</button></div>` : '';
  return contacts + (items || `<div class="vide"><span>${L.ico}</span>${t('rien')}</div>`) +
    `<button class="ajouter" aria-label="${t('ajouter')}" onclick="formulaire('${nom}')">+</button>`;
}

function champ([cle, txt, type], val) {
  if (type === 'qui') return `<label>${t(txt)}</label><select name="${cle}"><option value="">${t('personne')}</option>` +
    d.famille.map(p => `<option value="${p.id}" ${p.id === val ? 'selected' : ''}>${esc(p.nom)}</option>`).join('') + `</select>`;
  if (type === 'textarea') return `<label>${t(txt)}</label><textarea name="${cle}" rows="4">${esc(val)}</textarea>`;
  // La photo est réduite dès qu'elle est choisie et gardée dans un champ caché.
  if (type === 'photo' || type === 'fond') return `<label>${t(txt)}</label><div class="boutons" style="margin:0">
      <img class="apercu" src="${esc(val)}" alt="">
      <label class="btn" style="margin:0">${t('choisirPhoto')}<input type="file" accept="image/*" hidden onchange="choisirPhoto(this, ${type === 'fond' ? 1000 : 240})"></label>
      <button type="button" class="btn danger" onclick="choisirPhoto(this)">${t('retirer')}</button>
      <input type="hidden" name="${cle}" value="${esc(val)}"></div>`;
  return `<label>${t(txt)}</label><input name="${cle}" type="${type || 'text'}" value="${esc(val)}">`;
}

async function choisirPhoto(el, max) {
  const zone = el.closest('.boutons'), fichier = el.files?.[0];
  const url = fichier ? await reduire(fichier, max) : '';
  zone.querySelector('input[type=hidden]').value = url;
  zone.querySelector('.apercu').src = url;
}

function ouvrir(html, auSubmit) {
  $('dlg').innerHTML = `<form method="dialog">${html}<div class="boutons" style="margin-top:18px">
    <button class="btn plein" value="ok">${t('enregistrer')}</button><button class="btn" value="annuler" formnovalidate>${t('annuler')}</button></div></form>`;
  const f = $('dlg').querySelector('form');
  f.onsubmit = e => {
    if (e.submitter?.value !== 'ok') return;
    const avant = JSON.stringify(d);
    auSubmit(Object.fromEntries(new FormData(f)));
    if (!sauver()) { d = JSON.parse(avant); e.preventDefault(); } // trop plein : on annule, rien n'est perdu
    afficher();
  };
  $('dlg').showModal();
}

function formulaire(nom, id) {
  const L = LISTES[nom], x = d[nom].find(y => y.id === id) || {};
  ouvrir(`<h2>${L.ico} ${id ? t('modifier') : t('ajouter')}</h2>` + L.champs.map(c => champ(c, x[c[0]])).join('') +
    (id ? `<div class="boutons" style="margin-top:12px"><button type="button" class="btn danger" onclick="supprimer('${nom}','${id}')">🗑️ ${t('supprimer')}</button></div>` : ''),
    v => id ? (L.avant?.(x, v), Object.assign(x, v)) : d[nom].push({ id: Date.now().toString(36), ...v }));
  $('dlg').querySelector('input:not([type=file]):not([type=hidden]),select').required = true;
}

function supprimer(nom, id) {
  if (!confirm(t('confirmer'))) return;
  d[nom] = d[nom].filter(x => x.id !== id);
  sauver(); $('dlg').close(); afficher();
}

function ficheAide() {
  ouvrir(`<h2>💛 ${t('personneAidee')}</h2>` + [['nom','nom'],['photo','photo','photo'],['medecin','medecinTel'],['ramq','numRamq'],['notes','notes','textarea']]
    .map(c => champ(c, d.aide[c[0]])).join(''), v => d.aide = v);
}

function personnaliser() {
  const r = d.reglages;
  ouvrir(`<h2>${t('personnaliser')}</h2><label>${t('couleurs')}</label><div class="themes">` +
    Object.entries(THEMES).map(([k, [a, b]]) => `<label><input type="radio" name="theme" value="${k}" ${k === r.theme ? 'checked' : ''}>
      <span style="background:linear-gradient(135deg, ${a}, ${b})"></span>${t('th_' + k)}</label>`).join('') + `</div>
    <label>${t('apparence')}</label><select name="mode">${['auto','clair','sombre'].map(m => `<option value="${m}" ${m === r.mode ? 'selected' : ''}>${t(m)}</option>`).join('')}</select>` +
    champ(['fond', 'fondEcran', 'fond'], r.fond), v => d.reglages = v);
}

// Le texto part du téléphone de la personne principale : gratuit avec son forfait.
function demander(nom, id) {
  const x = d[nom].find(y => y.id === id);
  if (!d.famille.length) { alert(t('familleVide')); return; }
  $('dlg').innerHTML = `<h2>${t('aQui')}</h2>` + d.famille.map(p =>
    `<div class="carte famille">${avatar(p)}<div class="corps"><b>${esc(p.nom)}</b><div class="boutons">
      <a class="btn plein" href="sms:${encodeURIComponent(p.tel)}?body=${encodeURIComponent(LISTES[nom].message(x, p))}">${t('texter')}</a></div></div></div>`).join('') +
    `${nom === 'meds' ? '' : `<p class="petit">${t('apres')}</p>`}<div class="boutons"><button class="btn" onclick="$('dlg').close()">${t('fermer')}</button></div>`;
  $('dlg').showModal();
}

// Android donne aussi la photo du contact quand elle existe.
async function depuisContacts() {
  try {
    const dispo = await navigator.contacts.getProperties();
    const choix = await navigator.contacts.select(['name', 'tel', ...(dispo.includes('icon') ? ['icon'] : [])], { multiple: true });
    for (const c of choix) if (c.tel?.[0]) d.famille.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nom: c.name?.[0] || c.tel[0], tel: c.tel[0],
      photo: c.icon?.[0] ? await reduire(c.icon[0], 240) : '' });
    sauver(); afficher();
  } catch { /* la personne a annulé */ }
}

afficher();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
